<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.6" />

  <!-- Star of Excellence / Luxury Accent -->
  <path d="M 256,72 L 268,108 L 304,120 L 268,132 L 256,168 L 244,132 L 208,120 L 244,108 Z" fill="url(#goldGrad)" filter="url(#shadow)" />

  <!-- StayCraft Architectural Hotel Monogram / Emblem -->
  <g filter="url(#shadow)">
    <!-- Central Tower -->
    <path d="M 192,200 L 256,150 L 320,200 L 320,410 L 192,410 Z" fill="url(#cyanGrad)" opacity="0.95" />
    
    <!-- Left Wing -->
    <path d="M 120,260 L 192,220 L 192,410 L 120,410 Z" fill="#1e3a8a" opacity="0.85" />
    
    <!-- Right Wing -->
    <path d="M 392,260 L 320,220 L 320,410 L 392,410 Z" fill="#1e3a8a" opacity="0.85" />

    <!-- Architectural Glass Windows (Warm Gold Lighting) -->
    <rect x="220" y="225" width="24" height="32" rx="4" fill="url(#goldGrad)" />
    <rect x="268" y="225" width="24" height="32" rx="4" fill="url(#goldGrad)" />

    <rect x="220" y="275" width="24" height="32" rx="4" fill="url(#goldGrad)" />
    <rect x="268" y="275" width="24" height="32" rx="4" fill="url(#goldGrad)" />

    <rect x="220" y="325" width="24" height="32" rx="4" fill="url(#goldGrad)" />
    <rect x="268" y="325" width="24" height="32" rx="4" fill="url(#goldGrad)" />

    <!-- Left Wing Windows -->
    <rect x="145" y="285" width="22" height="28" rx="4" fill="#93c5fd" opacity="0.75" />
    <rect x="145" y="335" width="22" height="28" rx="4" fill="#93c5fd" opacity="0.75" />

    <!-- Right Wing Windows -->
    <rect x="345" y="285" width="22" height="28" rx="4" fill="#93c5fd" opacity="0.75" />
    <rect x="345" y="335" width="22" height="28" rx="4" fill="#93c5fd" opacity="0.75" />

    <!-- Grand Entrance Portico Arch -->
    <path d="M 232,410 L 232,375 C 232,365 242,358 256,358 C 270,358 280,365 280,375 L 280,410 Z" fill="url(#goldGrad)" />
  </g>
</svg>
